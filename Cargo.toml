[workspace]
resolver = "2"
members = [
    "core",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["p2p messenger"]

[workspace.dependencies]
ed25519-dalek = "2"
curve25519-dalek = "4"
crypto_box = "0.9"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
hex = "0.4"
bip39 = "2"
