[workspace]
resolver = "2"
members = [
    "core",
    "transport",
    "messenger",
    "media",
    "call",
    "group",
    "groupchat",
    "blob",
    "ntfy",
    "desktop",
    "engine",
    "androidjni",
]
# transport линкует Go-библиотеку libygg.so и собирается только под Linux (WSL).
# Дефолтная сборка (cargo build/test без -p) ограничена кросс-платформенными
# крейтами, чтобы не ломать Windows. transport собираем явно: cargo build -p p2p-ygg.
default-members = ["core"]

# Профиль release для всего воркспейса (в т.ч. android cdylib libp2p_android.so).
# Цель — меньше размер .so без риска для отзывчивости и корректности:
#   strip           — срезать таблицу символов (.symtab/.strtab ~2.7 МБ), код не трогает;
#   lto = "thin"    — межкрейтовый инлайн: меньше и обычно быстрее, приемлемый линк;
#   codegen-units=1 — лучше оптимизация/размер (дольше компиляция).
# opt-level НЕ трогаем (=3): крипта (MLS) и медиа чувствительны к скорости.
# panic="abort" ЗАПРЕЩЁН: ломает catch_unwind на JNI-границе (инвариант #1 —
# паника на границе обязана ловиться, иначе краш всего процесса).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.package]
edition = "2021"
# GPL-3.0: используем Slint под GPL-вариантом его три-лицензии, поэтому всё
# приложение копилефтное — исходники остаются открытыми и проверяемыми.
license = "GPL-3.0-only"
authors = ["p2p messenger"]

[workspace.dependencies]
ed25519-dalek = "2"
curve25519-dalek = "4"
crypto_box = { version = "0.9", features = ["std", "salsa20"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
hex = "0.4"
bip39 = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
proptest = "1"
