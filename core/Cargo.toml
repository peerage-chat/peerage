[package]
name = "peerage-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "peerage_core"
crate-type = ["lib"]

[dependencies]
ed25519-dalek = { workspace = true, features = ["rand_core"] }
sha2.workspace = true
rand_core.workspace = true
thiserror.workspace = true
hex.workspace = true
bip39.workspace = true
serde.workspace = true
serde_json.workspace = true
# Payload на проводе и в офлайн-очереди: самоописывающий бинарный формат
# (неизвестные типы/поля читаются, байты — байтами).
rmp-serde = "1.3"
serde_bytes = "0.11"
blake3.workspace = true
chacha20poly1305 = "0.10"
# Сессия 1:1 v2 (ADR-012): Noise XXhfs — X25519 + ML-KEM-768, BLAKE2s, HMAC.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
blake2 = "0.10"
hmac = "0.12"
# Формально проверенная реализация ML-KEM (hax/F*); случайность передаётся явно.
libcrux-ml-kem = "0.0.8" # та же версия, что тянет openmls (hpke-rs-libcrux)
zeroize = "1"
# Argon2id для уровня at-rest «пароль» (KDF от того, что пользователь ЗНАЕТ).
argon2 = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# На хосте (тесты, desktop) — обычный bundled SQLite.
# На Android — включается feature "sqlcipher" из androidjni/Cargo.toml,
# который добавляет bundled-sqlcipher-vendored-openssl через Cargo feature merging.
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
# Активируется только для Android-таргета через androidjni.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
hex = "0.4"
# Эталон классической части Noise XX в тестах ADR-012 (байт-в-байт).
snow = "0.10"
proptest.workspace = true

# Доказательства Kani (план беты, шаг 6): `scripts/kani.sh`. cfg(kani) включает их
# только под верификатором; объявляем его, чтобы обычная сборка не ругалась.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
