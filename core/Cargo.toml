[package]
name = "p2p-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "p2p_core"
crate-type = ["lib"]

[dependencies]
ed25519-dalek = { workspace = true, features = ["rand_core"] }
curve25519-dalek.workspace = true
crypto_box.workspace = true
sha2.workspace = true
rand_core.workspace = true
thiserror.workspace = true
hex.workspace = true
bip39.workspace = true
serde.workspace = true
serde_json.workspace = true
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# На хосте (тесты, desktop) — обычный bundled SQLite.
# На Android — включается feature "sqlcipher" из androidjni/Cargo.toml,
# который добавляет bundled-sqlcipher-vendored-openssl через Cargo feature merging.
rusqlite = { version = "0.31", features = ["bundled"] }

[features]
# Активируется только для Android-таргета через androidjni.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
hex = "0.4"
proptest.workspace = true
