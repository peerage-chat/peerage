[package]
name = "peerage-group"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "peerage_group"

[dependencies]
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
# Прямая зависимость с feature test-utils включает serialize/deserialize у
# MemoryStorage (нужно для сохранения/загрузки группы; свой StorageProvider избегаем).
openmls_memory_storage = { version = "0.5", features = ["test-utils"] }
thiserror.workspace = true
peerage-core = { path = "../core" }
