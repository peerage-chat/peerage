[package]
name = "peerage-call"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "peerage_call"

[dependencies]
cpal = "0.15"
xcap = { version = "0", optional = true }
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }
image = { version = "0.25", default-features = false, optional = true }
thiserror.workspace = true
litertc = { path = "../litertc" }
peerage-core = { path = "../core" }
peerage-messenger = { path = "../messenger" }
peerage-media = { path = "../media" }

[features]
# Захват экрана/камеры тянет тяжёлые системные библиотеки (pipewire/gbm/drm) —
# включается только там, где реально нужен (десктоп).
capture = ["dep:xcap", "dep:nokhwa", "dep:image"]

[dev-dependencies]
peerage-ygg = { path = "../transport" }

[[example]]
name = "screen_probe"
required-features = ["capture"]
