[package]
name = "peerage-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

# Device-independent ядро движка (ADR-003). Зависит от транспорта (libygg) →
# собирается под Linux/WSL, как и androidjni. Юнит-тесты ядра (net.rs, презенс)
# не требуют устройства/эмулятора.
[lib]
name = "peerage_engine"

[dependencies]
log = "0.4"
serde = { workspace = true }
serde_json = "1"
hex.workspace = true
litertc = { path = "../litertc" }
peerage-core = { path = "../core", features = ["sqlcipher"] }
peerage-messenger = { path = "../messenger" }
peerage-media = { path = "../media" }
peerage-group = { path = "../group" }
peerage-groupchat = { path = "../groupchat" }
peerage-blob = { path = "../blob" }
peerage-ygg = { path = "../transport" }

[target.'cfg(unix)'.dependencies]
# Свободное место на диске перед докачкой крупного блоба (statvfs).
libc = "0.2"
