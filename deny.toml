# Конфигурация cargo-deny — проверка зависимостей на уязвимости, лицензии и дубли.
# Запуск: cargo install cargo-deny && cargo deny check
# (или: bash scripts/audit-deps.sh)

[advisories]
# База RustSec. Падать при найденных уязвимостях/непатченных предупреждениях.
version = 2
yanked = "deny"
ignore = [
    # Сюда добавляйте RUSTSEC-идентификаторы с обоснованием, если уязвимость
    # неприменима к нашему сценарию. Пример:
    # "RUSTSEC-0000-0000", # причина
]

[licenses]
version = 2
# Разрешённые лицензии (permissive + типичные для крипто/Rust-экосистемы).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
# Предупреждать о нескольких версиях одной библиотеки (раздувание/риск).
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
