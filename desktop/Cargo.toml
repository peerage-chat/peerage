[package]
name = "peerage-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
slint-build = "1"

[dependencies]
slint = "1"
arboard = "3"
hex.workspace = true
serde_json.workspace = true
peerage-core = { path = "../core" }
peerage-ygg = { path = "../transport" }
peerage-messenger = { path = "../messenger" }
peerage-media = { path = "../media" }
peerage-call = { path = "../call", features = ["capture"] }
peerage-group = { path = "../group" }
peerage-groupchat = { path = "../groupchat" }
