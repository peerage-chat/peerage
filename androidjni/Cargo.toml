[package]
name = "peerage-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

# JNI-кодек: cdylib грузится из Kotlin через System.loadLibrary("peerage_android").
# Доменная логика — в крейте peerage-engine; здесь только маршалинг JNI ↔ движок.
[lib]
name = "peerage_android"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
log = "0.4"
android_logger = "0.14"
serde_json = "1"
hex.workspace = true
peerage-core = { path = "../core", features = ["sqlcipher"] }
peerage-engine = { path = "../engine" }
